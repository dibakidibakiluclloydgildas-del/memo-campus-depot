# =============================================================================
# MÉMO CAMPUS — Blueprint Render (lien permanent, base PostgreSQL, HTTPS)
#
# Utilisation : Render → New → Blueprint → sélectionner ce dépôt.
# Voir infrastructure/deploy/RENDER.md pour la procédure détaillée.
#
# Deux services : l'API (port 4000) et le Web (port 3000). Le Web parle à l'API
# côté serveur : aucune clé, aucun secret n'est exposé au navigateur.
# =============================================================================
services:
  # ----------------------------------------------------------------- API -----
  - type: web
    name: memo-api
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./infrastructure/deploy/render-api.Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: STORAGE_DRIVER
        value: local
      - key: STORAGE_DIR
        value: /data/storage
      - key: MAX_UPLOAD_MB
        value: 25
      - key: AI_PROVIDER
        value: demo
      - key: AI_DEMO_MODE
        value: true
      - key: EMBEDDINGS_PROVIDER
        value: local
      - key: EMBEDDINGS_DIM
        value: 768
      # Renseignés à la main dans Render (voir RENDER.md §4)
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: APP_URL
        sync: false
      - key: API_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false

  # ----------------------------------------------------------------- WEB -----
  - type: web
    name: memo-web
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./infrastructure/deploy/render-web.Dockerfile
    dockerContext: .
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      # Adresse publique de l'API (côté serveur uniquement)
      - key: API_INTERNAL_URL
        sync: false
      # Accès invité « un clic » pour les testeurs
      - key: ALLOW_DEMO_LOGIN
        value: true
      - key: DEMO_STUDENT_EMAIL
        value: etudiant@demo.memo-campus.cm
      - key: DEMO_STUDENT_PASSWORD
        value: MemoCampus2026!
